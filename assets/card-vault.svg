<svg xmlns="http://www.w3.org/2000/svg" width="600" height="278" viewBox="0 0 600 278" role="img" aria-label="Vault: Turns an Android phone into a private AI coprocessor. Documents stay encrypted on-device; the laptop only receives a signed answer capsule and checks it before trusting it.">
