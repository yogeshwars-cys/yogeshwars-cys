  @keyframes litText { 0%, 26%, 100% { fill: #0a2463; } 9%, 17% { fill: #ffffff; } }
  
  .orbit { fill: none; stroke-linecap: round; stroke-dasharray: 70 930; animation: orbit linear infinite; }
